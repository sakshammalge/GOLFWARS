services:
  - type: web
    name: golfwars-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build:libs && pnpm --filter @golfwars/server build
    startCommand: pnpm --filter @golfwars/server start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production # the dev balance file hot reload is ignored in production
