<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GolfWars</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b2a1f;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #status {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 4px 10px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 14px;
      }
      #debug {
        position: fixed;
        top: 8px;
        right: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.6);
        color: #ff9;
        font:
          12px/1.4 ui-monospace,
          monospace;
        white-space: pre;
        pointer-events: none;
      }
      #debug[hidden] {
        display: none;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
      }
      #hud-strokes {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 16px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.55);
        font-size: 20px;
        font-weight: 600;
        white-space: nowrap;
      }
      #hud-meter {
        position: absolute;
        bottom: 56px;
        left: 50%;
        transform: translateX(-50%);
        width: 360px;
        height: 26px;
        border-radius: 13px;
        background: rgba(0, 0, 0, 0.55);
        border: 2px solid rgba(255, 255, 255, 0.85);
        overflow: hidden;
      }
      #hud-meter[hidden],
      #hud-toast[hidden] {
        display: none;
      }
      #hud-meter-fill {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, #7ddc6b, #f2d94e 60%, #ef5a4c);
      }
      #hud-meter-text {
        position: absolute;
        inset: 0;
        text-align: center;
        line-height: 26px;
        font-size: 14px;
        font-weight: 700;
      }
      #hud-toast {
        position: absolute;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        border-radius: 8px;
        background: rgba(200, 60, 40, 0.85);
        font-weight: 600;
      }
      #hud-hint {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 12px;
        border-radius: 6px;
        background: rgba(0, 0, 0, 0.45);
        font-size: 12px;
        white-space: nowrap;
      }
      #status.ok {
        color: #8f8;
      }
      #status.bad {
        color: #f88;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status">Server: connecting...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
